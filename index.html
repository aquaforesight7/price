<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Каталог і ціни Аква Форсайт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sprites.css">
<style>
:root{
  /* layout: section rail left, the whole catalogue as one long list right; a row unfolds in place; the order list lives in a side drawer.
     signature: "what to remove from water" chips that filter the entire catalogue */
  --bg:#F1F4F8; --surface:#FFFFFF; --ink:#0B1D2C; --muted:#5A6B7C; --line:#D8E0E9; --soft:#E7EDF4;
  --accent:#0A5AD0; --accent-ink:#FFFFFF; --good:#0B7A40; --good-bg:#DDF3E6; --warn:#A35F00; --warn-bg:#FCEFD9; --bad:#C5221F;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --top:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#09121B; --surface:#101C28; --ink:#E7EEF5; --muted:#8DA1B3; --line:#223140; --soft:#172433;
    --accent:#5BA1FF; --accent-ink:#06121F; --good:#49C288; --good-bg:#12321F; --warn:#E3A84A; --warn-bg:#3A2A10; --bad:#FF7B72; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#09121B; --surface:#101C28; --ink:#E7EEF5; --muted:#8DA1B3; --line:#223140; --soft:#172433;
  --accent:#5BA1FF; --accent-ink:#06121F; --good:#49C288; --good-bg:#12321F; --warn:#E3A84A; --warn-bg:#3A2A10; --bad:#FF7B72; color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none !important}}
[hidden]{display:none !important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,.ph{-webkit-user-drag:none;pointer-events:auto}


.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 20px;min-height:var(--top);
  background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;color:inherit;text-decoration:none}
.brand i{width:10px;height:14px;background:var(--accent);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transform:translateY(2px) rotate(180deg);display:inline-block}
.search{flex:1 1 220px;min-width:160px}
.search input{width:100%;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;padding:3px;background:var(--soft);border-radius:10px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.cart{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;white-space:nowrap}
.cart b{font-variant-numeric:tabular-nums}
.cart.idle{background:var(--soft);color:var(--muted)}
.call{display:flex;align-items:center;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.call:hover{border-color:var(--accent)}

.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;max-width:1440px;margin:0 auto;padding:18px 20px 80px}
.rail{position:sticky;top:calc(var(--top) + 18px);align-self:start;max-height:calc(100dvh - var(--top) - 36px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.rail h2,.lbl{margin:0 0 6px;font-weight:600;font-size:10.5px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rail .sec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:baseline;width:100%;padding:5px 8px;border:0;background:none;text-align:left;border-radius:8px;font-size:13px}
.rail .sec span:last-child,.rail .grp span:last-child{font:500 10.5px/1.6 var(--mono);color:var(--muted)}
.rail .sec.on{background:var(--surface);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.rail .grp{display:flex;justify-content:space-between;gap:10px;width:100%;padding:3px 8px 3px 20px;border:0;background:none;text-align:left;font-size:12px;color:var(--muted);border-radius:8px}
.rail button:hover{background:var(--soft);color:var(--ink)}

.tools{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:2px 0 14px}
.tools>*,.wrap>*{min-width:0}
.tools h1{margin:0;font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.headline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
#stats{flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--muted)}
.rmgrid,.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rmgrid button{--h:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}
.rmgrid button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--h)}
.rmgrid button:hover{border-color:var(--h)}
.rmgrid button[aria-pressed="true"]{background:color-mix(in srgb,var(--h) 16%,var(--surface));border-color:var(--h);font-weight:600}
.chip2{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--muted)}
.chip2[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#hint{font-size:12.5px;color:var(--muted);min-height:18px}
#hint button{border:0;background:none;padding:0;color:var(--accent);font-weight:600}

.sech{position:relative;z-index:6;background:var(--bg);display:flex;align-items:baseline;gap:10px;margin:22px 0 2px;padding:6px 0 8px;scroll-margin-top:calc(var(--top) + 10px)}
.sech h2{margin:0;font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.sech span{font-size:12.5px;color:var(--muted)}
.grph{position:sticky;top:var(--top);z-index:5;display:flex;justify-content:space-between;gap:12px;margin:10px 0 5px;padding:7px 2px 5px;background:var(--bg);
  border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;scroll-margin-top:var(--top)}
.grph small{font-weight:400;color:var(--muted)}
.grph > span:last-child{font:500 11.5px/1.5 var(--mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:clip;content-visibility:auto;contain-intrinsic-size:auto 420px}
.row + .row{border-top:1px solid var(--line)}
.row summary{display:grid;grid-template-columns:86px 60px minmax(0,1.6fr) minmax(0,.9fr) 170px 34px;grid-template-areas:"cd ph main chars price add";gap:4px 12px;align-items:center;
  padding:6px 10px 6px 12px;cursor:pointer;list-style:none}
.row summary::-webkit-details-marker{display:none}
.row summary:hover{background:color-mix(in srgb,var(--soft) 55%,var(--surface))}
.row[open] > summary{background:var(--soft)}
.cd{grid-area:cd;font:700 16.5px/1.25 var(--body);font-variant-numeric:tabular-nums lining-nums;color:var(--ink);letter-spacing:.01em}
.row.np .cd{color:var(--muted)}
.ph{grid-area:ph;--s:60px;width:var(--s);height:var(--s);border-radius:9px;display:block;background-color:#fff;background-repeat:no-repeat;
  background-size:calc(24 * var(--s)) auto;background-position:calc(var(--x,0) * -1 * var(--s)) calc(var(--y,0) * -1 * var(--s));box-shadow:inset 0 0 0 1px var(--line)}
.main{grid-area:main;min-width:0}
.name{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;margin-top:3px;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.meta code{font:500 11px/1 var(--mono);color:var(--ink)}
.av{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-weight:600;font-size:11px;white-space:nowrap;line-height:1.5}
.av::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av.s1{background:var(--good-bg);color:var(--good)}
.av.s2{background:var(--warn-bg);color:var(--warn)}
.av.s0{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.chars{grid-area:chars;display:flex;flex-wrap:wrap;gap:3px 4px;min-width:0;align-items:center}
.pill{--h:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 6px;border-radius:999px;font-size:11px;white-space:nowrap;
  background:color-mix(in srgb,var(--h) 13%,var(--surface));color:color-mix(in srgb,var(--h) 70%,var(--ink))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h)}
.more-n{font-size:11px;color:var(--muted)}
.price{grid-area:price;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.price b{font-size:16.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.price small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noprice{font-size:12px;color:var(--muted)}
.row.np .name{color:var(--muted)}
.add{grid-area:add;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:700 16px/1 var(--body);color:var(--accent);display:grid;place-items:center}
.add:hover{border-color:var(--accent)}
.add.in{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:700 11.5px/1 var(--mono)}

body.compact .row summary{grid-template-columns:74px 28px minmax(0,2fr) minmax(0,.8fr) 150px 28px;padding:3px 8px 3px 10px;gap:0 10px}
body.compact .ph{--s:28px;border-radius:6px} body.compact .cd{font-size:14px}
body.compact .main{display:flex;gap:10px;align-items:center}
body.compact .meta{order:-1;flex:none;flex-wrap:nowrap;width:150px;margin:0;overflow:hidden}
body.compact .meta .t{display:none}
body.compact .name{flex:1;min-width:0;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .chars{flex-wrap:nowrap;overflow:hidden}
body.compact .price b{font-size:14px}
body.compact .price small{display:none}
body.compact .add{width:24px;height:24px;border-radius:6px;font-size:14px}

.more{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px 30px;padding:12px 14px 16px 182px;background:var(--soft);border-top:1px solid var(--line);font-size:13px}
.more h3{margin:0 0 5px;font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.more > div{min-width:0;display:grid;gap:14px;align-content:start}
.vtw{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.vt th{padding:3px 10px 3px 0;font-weight:500;font-size:11.5px;color:var(--muted);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.vt td{padding:5px 10px 5px 0;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.vt th:first-child,.vt td:first-child{text-align:left;white-space:normal}
.vt td.b{font-weight:700}
.vt .add{display:inline-grid;width:26px;height:26px;font-size:14px}
.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.facts code{font:500 12px/1 var(--mono)}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px;text-align:left;font-size:12px}
.alts button:hover{border-color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.05)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.foot{margin:30px 0 0;font-size:12.5px;color:var(--muted);max-width:75ch}
.foot a{color:var(--accent)}

.scrim{position:fixed;inset:0;z-index:40;background:rgb(6 14 22 / .45)}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(460px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgb(0 0 0 / .18)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-weight:700;font-size:17px;letter-spacing:-.02em}
.x{width:32px;height:32px;border:0;border-radius:8px;background:var(--soft);font-size:16px}
.db{overflow:auto;padding:10px 16px 16px;display:grid;gap:14px;align-content:start}
.ol{display:grid;grid-template-columns:minmax(0,1fr) auto auto 22px;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ol .on{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.ol .om{grid-column:1 / -1;font-size:11.5px;color:var(--muted)}
.ol .om code{font:500 11px/1 var(--mono);color:var(--ink)}
.ol .os{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:82px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:26px;height:28px;border:0;background:var(--soft);font-weight:700}
.qty input{width:42px;height:28px;border:0;background:none;text-align:center;font:500 12.5px/1 var(--mono);-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.rm{border:0;background:none;color:var(--muted);font-size:15px;padding:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;margin:0}
.tot .big{font-size:20px;font-weight:700;color:var(--ink)}
.tot dd{margin:0;text-align:right}
.note{margin:0;padding:9px 11px;border-radius:10px;background:var(--soft);font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:8px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select,.form textarea{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13.5px}
.form textarea{height:60px;padding:8px 10px;resize:vertical}
.form .err{border-color:var(--bad)}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn.msg{background:var(--c);border-color:var(--c);color:#fff}
.copybox{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;padding:8px;font:500 12px/1.4 var(--mono);background:var(--bg)}

@media (max-width: 1040px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:8px}
  .rail{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:0 0 6px}
  .rail h2,.rail .grp{display:none}
  .rail .sec{display:flex;width:auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .rail .sec.on{box-shadow:none;border-color:var(--accent)}
}
@media (max-width: 760px){
  :root{--top:102px}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;padding:9px 14px} .wrap{padding:12px 14px 70px}
  .search{grid-column:1 / -1;grid-row:2}
  .top .seg{display:none}
  .opts.mob{display:flex !important}
  .rmgrid button,.chip2,.sep{flex:none}
  #hint:not(.f){display:none}
  .tools h1{font-size:22px}
  .row summary,body.compact .row summary{grid-template-columns:56px minmax(0,1fr) auto 30px;grid-template-areas:"ph cd price add" "ph main main main" "ph chars chars chars";padding:8px 10px;gap:3px 10px}
  .ph,body.compact .ph{--s:56px;align-self:start} .cd,body.compact .cd{font-size:16.5px} .price b{font-size:15px}
  body.compact .main{display:block} body.compact .meta{width:auto;flex-wrap:wrap} body.compact .name{white-space:normal}
  .more{grid-template-columns:minmax(0,1fr);padding:12px}
}
@media (max-width: 430px){
  .brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .top{gap:6px} .call{padding:0 10px} .cart{padding:0 11px;gap:6px}
  .cart .cs{display:none}
  .cart b.cn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent-ink);color:var(--accent);font-size:12px}
}
@media (max-width: 360px){ .cart .cl{display:none} .cart::before{content:"🛒";font-size:15px} }
.secbtn,.rmbtn{display:none}
.sheet,.sheetbg{display:none}
@media (max-width: 760px){
  .rail{display:none !important}
  .grph{top:calc(var(--top) + 52px)} .sech{scroll-margin-top:calc(var(--top) + 62px)} .grph{scroll-margin-top:calc(var(--top) + 52px)}
  .secbtn{display:flex;align-items:center;gap:8px;position:sticky;top:var(--top);z-index:5;width:100%;height:44px;margin:0 0 10px;padding:0 14px;border:1px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-align:left;box-shadow:0 0 0 8px var(--bg)}
  .secbtn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .secbtn small{color:var(--muted);font-weight:500;font-size:13px}
  .secbtn::before{content:"☰";color:var(--accent)} .secbtn::after{content:"▾";color:var(--muted)}
  .tools>div>.lbl{display:none}
  .rmbtn{display:flex;align-items:center;gap:8px;width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-align:left}
  .rmbtn span{flex:1} .rmbtn b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px}
  .rmbtn::before{content:"💧"} .rmbtn::after{content:"▾";color:var(--muted)} .rmbtn[aria-expanded="true"]::after{content:"▴"}
  .rmgrid{display:none !important}
  .rmgrid.open{display:flex !important;flex-wrap:wrap !important;overflow:visible !important;margin-top:8px;padding:0}
  .chips{flex-wrap:wrap !important;overflow:visible !important}
  .sheetbg:not([hidden]){display:block;position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .45)}
  .sheet:not([hidden]){display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:80vh;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgb(0 0 0 / .25)}
  .sheeth{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
  #sheetl{overflow-y:auto;padding:6px 8px 20px}
  #sheetl button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px 10px;border:0;border-bottom:1px solid var(--line);background:none;font-size:15.5px;text-align:left;color:var(--ink)}
  #sheetl button span:last-child{color:var(--muted);font-size:13px}
  #sheetl button.on{color:var(--accent);font-weight:700}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="https://aquaforesight.com.ua/ua/" target="_blank" rel="noopener"><i></i>Аква Форсайт</a>
  <label class="search"><input id="q" type="search" autocomplete="off"></label>

  document.title = T('title') + ' · Аква Форсайт';
  document.body.classList.toggle('compact', st.compact);
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('q').placeholder = T('ph'); $('q').setAttribute('aria-label', T('ph'));
  document.querySelectorAll('[data-seg="lang"] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === st.lang));
  $('rm').innerHTML = T('rm').map((n, k) => `<button type="button" data-rm="${k}" aria-pressed="${st.rm.has(k)}" style="--h:${RM[k]}">${n}</button>`).join(''); rmBtn();
  $('chips').innerHTML = `<button type="button" class="chip2" data-f="stock" aria-pressed="${st.stock}">${T('f_stock')}</button><button type="button" class="chip2" data-f="priced" aria-pressed="${st.priced}">${T('f_priced')}</button>`
    + `<span class="sep"></span><button type="button" class="chip2" data-f="compact" aria-pressed="${st.compact}">${T('compact')}</button>`;
  $('foot').innerHTML = `${T('foot')}${st.lang !== 'uk' ? ' ' + T('lang_note') : ''} Аква Форсайт: ${PHONE} · <a href="${LINK}" target="_blank" rel="noopener">${T('contact_s')}</a> · <a href="https://aquaforesight.com.ua/${st.lang === 'uk' ? 'ua/' : ''}" target="_blank" rel="noopener">aquaforesight.com.ua</a>`;
  cartBtn();
}

/* ---------- order list ---------- */
const oitem = o => { const it = BYCODE.get(o.c); return it ? {it, v: it.v[o.v] || prim(it)} : null; };
function totals(){ let sum = 0, n = 0, unk = 0; for (const o of st.order){ const x = oitem(o); if (!x) continue; n++; if (!x.v.r){ unk++; continue; } sum += x.v.r * o.q; } return {sum, n, unk}; }
function cartBtn(){ const t = totals(), b = $('cart'); b.classList.toggle('idle', !t.n); b.innerHTML = `<span class="cl">${T('order')}</span>${t.n ? ` <b class="cn">${t.n}</b><span class="cs"> · <b>${nf(t.sum)} ₴</b></span>` : ''}`; }
function addToOrder(i, vi){
  const it = DATA[i]; const v = vi == null ? it.p : +vi;
  const o = st.order.find(o => o.c === it.c && o.v === v);
  if (o) o.q++; else st.order.push({c: it.c, v, q: 1});
  save(); cartBtn(); refreshAdd(it);
  if (!$('drawer').hidden) drawer();
}
function refreshAdd(it){
  const q = qtyIn(it);
  const b = document.querySelector(`#i${it._i} > summary .add`); if (b){ b.classList.toggle('in', !!q); b.textContent = q || '+'; }
  const d = document.querySelector(`#i${it._i} .acts .btn[data-add]`); if (d) d.textContent = q ? T('added') + ' · ' + q : T('add');
}
function orderText(){
  const f = st.form, lines = [T('o_hdr'), ''];
  st.order.forEach((o, k) => { const x = oitem(o); if (!x) return;
    lines.push(`${k + 1}. ${x.it.n}${x.it.v.length > 1 && x.v.l ? ' (' + x.v.l + ')' : ''} [${x.it.c}]: ${o.q} × ${x.v.r ? nf(x.v.r) + ' ₴ = ' + nf(x.v.r * o.q) + ' ₴' : T('o_noprice')}`); });
  lines.push('', `${T('o_total')}: ${nf(totals().sum)} ₴`, '', `${T('o_name')}: ${f.n}`, `${T('o_phone')}: ${f.p}`);
  if (f.c) lines.push(`${T('o_city')}: ${f.c}`);
  lines.push(`${T('o_pay')}: ${T('pays')[f.pay]}`);
  if (f.m) lines.push(`${T('o_comment')}: ${f.m}`);
  return lines.join('\n');
}
function drawer(msg){
  const t = totals();
  let h = '';
  if (!t.n) h = `<p class="note">${T('o_empty')}</p>`;
  else {
    h += '<div>' + st.order.map((o, k) => { const x = oitem(o); if (!x) return '';
      return `<div class="ol"><div class="on">${esc(x.it.n)}</div><div class="qty"><button type="button" data-q="${k}" data-d="-1" aria-label="−">−</button><input type="number" min="1" value="${o.q}" data-qi="${k}" aria-label="${T('qty')}"><button type="button" data-q="${k}" data-d="1" aria-label="+">+</button></div>`
        + `<div class="os">${x.v.r ? nf(x.v.r * o.q) + ' ₴' : '—'}</div><button type="button" class="rm" data-del="${k}" aria-label="×">×</button>`
        + `<div class="om"><code>${esc(x.it.c)}</code>${x.it.v.length > 1 && x.v.l ? ' · ' + esc(x.v.l) : ''} · ${x.v.r ? nf(x.v.r) + ' ₴' : T('o_noprice')}</div></div>`; }).join('') + '</div>';
    h += `<dl class="tot"><dt class="big">${T('o_total')}</dt><dd class="big">${nf(t.sum)} ₴</dd></dl>`;
    if (t.unk) h += `<p class="note">${T('o_noprice')}: ${t.unk}</p>`;
    const f = st.form;
    h += `<div class="form"><label>${T('o_name')}<input id="f-n" value="${esc(f.n)}" autocomplete="name"></label><label>${T('o_phone')}<input id="f-p" type="tel" value="${esc(f.p)}" autocomplete="tel"></label>`
      + `<label>${T('o_city')}<input id="f-c" value="${esc(f.c)}"></label><label>${T('o_pay')}<select id="f-pay">${T('pays').map((p, k) => `<option value="${k}"${+f.pay === k ? ' selected' : ''}>${p}</option>`).join('')}</select></label>`
      + `<label>${T('o_comment')}<textarea id="f-m">${esc(f.m)}</textarea></label></div><p class="note">${T('o_how')}</p>`;
    if (msg) h += msg;
  }
  $('dbody').innerHTML = h;
  $('dfoot').innerHTML = t.n ? `<div class="lbl" style="flex-basis:100%;margin:0">${T('o_send')}</div>` + Object.entries(MSGN).map(([k, [n, c]]) => `<button type="button" class="btn msg" data-msg="${k}" style="--c:${c}">${n}</button>`).join('')
    + `<button type="button" class="btn" id="oclear">${T('o_clear')}</button>` : '';
}
function openDrawer(on){ $('drawer').hidden = !on; $('scrim').hidden = !on; if (on) drawer(); }
async function send(kind){
  if (!st.form.n.trim() || st.form.p.replace(/\D/g, '').length < 9){
    drawer(`<p class="note" style="color:var(--bad)">${T('o_need')}</p>`);
    for (const id of ['f-n', 'f-p']) { const el = $(id); if (el && (id === 'f-n' ? !st.form.n.trim() : st.form.p.replace(/\D/g, '').length < 9)) el.classList.add('err'); }
    return;
  }
  const text = orderText();
  let framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  const viaContacts = kind === 'viber' && framed;   // viber:// is blocked inside an embedded frame: open the contacts page instead
  const a = document.createElement('a'); a.href = viaContacts ? LINK : MSG[kind](text); a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  let copied = true;
  try { await navigator.clipboard.writeText(text); } catch (e) { copied = false; }
  drawer(copied ? `<p class="note" style="color:var(--good)"><b>${viaContacts ? T('o_viber') : T('o_copied')}</b></p>`
    : `<p class="note">${T('o_manual')}</p><textarea class="copybox" readonly>${esc(text)}</textarea><p class="note"><a href="${LINK}" target="_blank" rel="noopener">${T('o_open')} ↗</a></p>`);
}

/* copy protection (deterrent) */
const editable = t => t && t.closest && t.closest('input,textarea,select');
for (const ev of ['copy','cut','contextmenu','dragstart','selectstart']) document.addEventListener(ev, e => { if (!editable(e.target)) e.preventDefault(); });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['s','p','u','a','c','x'].includes(e.key.toLowerCase()) && !editable(e.target)) e.preventDefault(); }, true);
let qT = 0;
$('q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { st.q = e.target.value.trim().toLowerCase(); render(); }, 140); });
document.addEventListener('click', e => {
  const t = e.target, b = t.closest('button');
  if (!b){ if (t.id === 'scrim') openDrawer(false); if (t.id === 'sheetbg') sheet(false); return; }
  const d = b.dataset;
  if ('add' in d){ e.preventDefault(); e.stopPropagation(); addToOrder(+d.add, d.v); return; }
  if (d.lang){ st.lang = d.lang; save(); chrome(); render(); }
  else if (d.rm){ const k = +d.rm; st.rm.has(k) ? st.rm.delete(k) : st.rm.add(k); b.setAttribute('aria-pressed', st.rm.has(k)); rmBtn(); render(); }
  else if (b.id === 'secbtn') sheet(true);
  else if (b.id === 'sheetx') sheet(false);
  else if (b.id === 'rmbtn'){ const o = !$('rm').classList.contains('open'); $('rm').classList.toggle('open', o); b.setAttribute('aria-expanded', o); }
  else if (d.f){ st[d.f] = !st[d.f]; save(); chrome(); if (d.f !== 'compact') render(); }
  else if (b.id === 'reset'){ st.q = ''; $('q').value = ''; st.rm.clear(); rmBtn(); st.priced = st.stock = false; chrome(); render(); }
  else if (d.to){ const el = document.getElementById(d.to); if (d.sh){ sheet(false); setTimeout(() => { if (!el) return; const h = el.querySelector('.sech') || el; const off = document.querySelector('.top').offsetHeight + $('secbtn').offsetHeight + 16; scrollTo({top: h.getBoundingClientRect().top + scrollY - off, behavior:'instant'}); }, 30); } else el?.scrollIntoView({block:'start'}); }
  else if (d.go){ const it = DATA[+d.go]; st.q = ''; $('q').value = ''; st.rm.clear(); st.priced = st.stock = false; chrome(); render();
    const el = document.getElementById('i' + it._i); if (el){ el.open = true; el.scrollIntoView({block:'center'}); } }
  else if (b.id === 'cart') openDrawer(true);
  else if (b.id === 'dclose') openDrawer(false);
  else if (d.q){ const o = st.order[+d.q]; o.q = Math.max(1, o.q + +d.d); save(); drawer(); cartBtn(); refreshAdd(BYCODE.get(o.c)); }
  else if (d.del){ const o = st.order.splice(+d.del, 1)[0]; save(); drawer(); cartBtn(); refreshAdd(BYCODE.get(o.c)); }
  else if (b.id === 'oclear'){ const old = st.order; st.order = []; save(); drawer(); cartBtn(); old.forEach(o => { const it = BYCODE.get(o.c); if (it) refreshAdd(it); }); }
  else if (d.msg) send(d.msg);
});
document.addEventListener('input', e => {
  const id = e.target.id, map = {'f-n':'n', 'f-p':'p', 'f-c':'c', 'f-pay':'pay', 'f-m':'m'};
  if (map[id]){ st.form[map[id]] = id === 'f-pay' ? +e.target.value : e.target.value; e.target.classList.remove('err'); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.qi){ const o = st.order[+t.dataset.qi]; o.q = Math.max(1, Math.round(+t.value) || 1); save(); drawer(); cartBtn(); refreshAdd(BYCODE.get(o.c)); }
});
$('list').addEventListener('toggle', e => { const d = e.target; if (d.open && d.id){ const box = d.querySelector('.more'); if (!box.firstChild) box.innerHTML = details(DATA[+d.id.slice(1)]); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drawer').hidden) openDrawer(false); });
addEventListener('scroll', () => { cancelAnimationFrame(spyT); spyT = requestAnimationFrame(spy); }, {passive:true});

function start(payload){
  DATA = payload.items; META = payload.meta;
  DATA.forEach((it, i) => { it._i = i; it._h = (it.n + ' ' + it.c + ' ' + (it.a || '') + ' ' + it.v.map(v => v.c || '').join(' ') + ' ' + (it.tags || []).join(' ') + ' ' + it.g + ' ' + (it.g0 || '')).toLowerCase(); });
  BYCODE = new Map(DATA.map(it => [it.c, it])); SECS = [...new Set(DATA.map(d => d.t))];
  st.order = st.order.filter(o => BYCODE.has(o.c));
  chrome(); render();
}
chrome();
/*INLINE*/fetch('data.json', {cache:'no-cache'}).then(r => r.json()).then(start)
  .catch(() => { $('list').innerHTML = `<p class="empty">${st.lang === 'en' ? 'Could not load the catalogue. Refresh the page.' : st.lang === 'ru' ? 'Не удалось загрузить каталог. Обновите страницу.' : 'Не вдалося завантажити каталог. Оновіть сторінку.'}</p>`; });
</script>
</body>
